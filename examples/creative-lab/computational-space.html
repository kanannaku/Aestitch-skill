<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Computational Space — Aestitch demo</title><style>
:root{color-scheme:dark;--paper:#eee9dc;--ink:#090e12;--signal:#d5fb79}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:var(--paper);font-family:Arial,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(90deg,#000,transparent 90%)}header{display:flex;align-items:center;justify-content:space-between;padding:28px 5.5%;border-bottom:1px solid #c6d1ca49}.brand{font-size:16px;letter-spacing:-.05em;font-weight:800}nav{display:flex;gap:28px}a{color:inherit;text-decoration:none;font-size:11px;text-transform:uppercase;letter-spacing:.13em}nav a:hover,a:focus-visible{color:var(--signal)}main{min-height:calc(100vh - 75px);display:grid;grid-template-columns:42% 58%;align-items:stretch}section{padding:8vh 7vw 7vh 13%;position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center}.eyebrow{font:11px 'Courier New',monospace;letter-spacing:.08em;color:var(--signal);text-transform:uppercase}h1{font-weight:500;font-size:clamp(56px,7.5vw,135px);line-height:.88;letter-spacing:-.085em;margin:34px 0}p{max-width:360px;line-height:1.5;color:#ccd3d1;font-size:17px}.control{margin-top:40px;display:flex;align-items:center;gap:20px}.control button{background:var(--signal);color:var(--ink);border:none;border-radius:50%;width:54px;height:54px;font-size:22px;cursor:pointer}.control span{font:11px 'Courier New',monospace;color:#a1afac;letter-spacing:.08em}figure{margin:0;display:flex;align-items:center;position:relative;overflow:hidden}figure svg{width:100%;height:min(85vh,700px);overflow:visible}.wire{stroke:#96aaa9;stroke-width:1;opacity:.32}.wire.active{stroke:var(--signal);stroke-width:2;opacity:.96}.node{fill:#131e20;stroke:#7d9593;stroke-width:1}.node.active{fill:var(--signal);stroke:var(--signal)}.pulse{fill:var(--signal);opacity:.14}.label{font:10px 'Courier New',monospace;fill:#d7e0d8;letter-spacing:1px}figcaption{position:absolute;left:4%;bottom:30px;font:11px 'Courier New',monospace;color:#93aaa5}footer{border-top:1px solid #c6d1ca49;padding:20px 5.5%;font:10px 'Courier New',monospace;letter-spacing:.14em;display:flex;justify-content:space-between}@media(max-width:750px){header{padding:20px}nav{gap:15px}main{grid-template-columns:1fr}section{padding:55px 24px 12px}h1{font-size:clamp(62px,15vw,105px)}figure{min-height:380px}figure svg{height:430px}figcaption{left:24px}footer{padding:20px 24px}}@media(prefers-reduced-motion:no-preference){.wire,.node{transition:stroke .3s,fill .3s,opacity .3s}}
</style></head><body><header><div class="brand">A/ LAB <span style="color:var(--signal)">·</span></div><nav><a href="#idea">IDEA</a><a href="#system">SYSTEM</a></nav></header><main><section id="idea" data-aestitch-anchor="hero-copy"><div class="eyebrow">01 — learning as a living system</div><h1>Ideas<br>become<br>visible.</h1><p>Trace how a research question turns into experiments, evidence, and working code.</p><div class="control"><button id="toggle" aria-label="Show alternate research connection">↗</button><span id="state">SELECTED PATH / 01</span></div></section><figure id="system" data-aestitch-anchor="primary-visual"><svg role="img" aria-label="Abstract research relationships: an original graph illustration" viewBox="0 0 700 620"><g id="wires"><path class="wire active" d="M80 130 L270 150 L450 80 L590 180"/><path class="wire" d="M80 130 L200 320 L420 330 L590 180"/><path class="wire" d="M200 320 L300 510 L560 480 L590 180"/><path class="wire active" d="M270 150 L420 330 L560 480"/><path class="wire" d="M450 80 L420 330"/></g><g id="nodes"><circle class="pulse" cx="270" cy="150" r="68"/><circle class="node active" cx="80" cy="130" r="7"/><circle class="node active" cx="270" cy="150" r="10"/><circle class="node" cx="450" cy="80" r="7"/><circle class="node active" cx="590" cy="180" r="9"/><circle class="node" cx="200" cy="320" r="8"/><circle class="node active" cx="420" cy="330" r="11"/><circle class="node" cx="300" cy="510" r="7"/><circle class="node active" cx="560" cy="480" r="8"/></g><g class="label"><text x="80" y="103">QUESTION</text><text x="270" y="123">DATA</text><text x="450" y="52">MODEL</text><text x="565" y="153">RESULT</text><text x="400" y="363">EVIDENCE</text><text x="515" y="509">PROJECT</text></g></svg><figcaption>FIG. 01 / INTERACTIVE RESEARCH MAP</figcaption></figure></main><footer><span>SELF-CONTAINED PROTOTYPE</span><span>CREATIVE LAB / CONCEPT ONE</span></footer><script>let flip=false;document.getElementById('toggle').addEventListener('click',()=>{flip=!flip;document.querySelectorAll('.wire').forEach((el,i)=>el.classList.toggle('active',flip?[1,2,4].includes(i):[0,3].includes(i)));document.getElementById('state').textContent=flip?'SELECTED PATH / 02':'SELECTED PATH / 01';});</script></body></html>
