<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aestitch visual guardian example</title>
<style>
:root { font-family: system-ui, sans-serif; color: #252b24; background: #f4f2eb; }
body { margin: 0; }
main { max-width: 960px; margin: 0 auto; padding: 48px 24px 96px; }
header { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #777a6f; padding-bottom:22px; }
header span { font-size: 13px; letter-spacing:.18em; font-weight:700; }
header small { letter-spacing:.09em; }
h1 { font-size:clamp(3.7rem,9vw,8rem); font-weight:500; letter-spacing:-.075em; line-height:.99; margin:100px 0 28px; }
p { font-size:clamp(1rem, 1.7vw, 1.4rem); line-height:1.55; max-width:580px; }
.rule { height:1px; background:#a2a293; margin-top:120px; }
footer { padding-top:12px; font-size:13px; display:flex; justify-content:space-between; }
@media (max-width: 600px) { main {padding: 26px 20px 60px;} h1 {margin-top:74px;} .rule {margin-top:90px;} }
</style></head>
<body><main><header><span>AESTITCH / DEMO</span><small>VISUAL CHANGE EVIDENCE</small></header>
<h1>Design is<br>in the details.</h1><p>This simple local fixture makes screenshot capture and review reproducible. It is not a benchmark of aesthetic quality.</p>
<div class="rule"></div><footer><span>LOCAL / PRIVATE</span><span>2026 — SUATLORA</span></footer></main></body></html>
